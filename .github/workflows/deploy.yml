name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# NOTE: before the first deploy will succeed, the repo's Pages source must be
# set to "GitHub Actions" once, manually, in Settings > Pages. This is not
# automatable from a workflow file.

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push should win over an in-flight one
# rather than race it, but never cancel a deploy that's already live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
