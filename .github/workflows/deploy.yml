name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# NOTE: the repo's Pages source must be "GitHub Actions", not a branch. In
# branch mode this workflow still builds and uploads the artifact and reports
# success, but Pages serves the repo root instead — which publishes the source
# index.html and its /src/main.ts script tag, giving a blank page. Check and fix
# with:
#   gh api repos/tomchute/well-read/pages --jq .build_type   # want "workflow"
#   gh api -X PUT repos/tomchute/well-read/pages -f build_type=workflow

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push should win over an in-flight one
# rather than race it, but never cancel a deploy that's already live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
